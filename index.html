<!doctype html><html lang='sv'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><title>Rydbecks EL Lager</title><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon-192.png'><link rel='icon' href='icon.svg' type='image/svg+xml'><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px 14px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}h1{font-size:27px;margin:0}small,.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:white;border-radius:16px;padding:15px;box-shadow:0 1px 4px #0001}.metric b{font-size:24px;display:block}.warn{color:#b45309}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}input,select,button{font:inherit;border-radius:12px;border:1px solid #d1d5db;padding:12px}input,select{background:white;min-width:0}#search{flex:1}button{background:#111827;color:white;border:0;font-weight:650}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px}.item h3{margin:0 0 5px;font-size:17px}.qty{font-size:22px;font-weight:750;text-align:right}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}.actions button{padding:7px 11px}.low{border:2px solid #f59e0b}dialog{border:0;border-radius:18px;width:min(94vw,560px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0008}.modal{padding:18px}.modal h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#6b7280}.form label span{display:block;margin-bottom:4px}.form input,.form select{width:100%}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;padding:40px 10px;color:#6b7280}.history{font-size:14px;border-bottom:1px solid #eee;padding:10px 0}.tabs{display:flex;gap:8px;margin-bottom:12px}.utility{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.utility button{font-size:14px}.quick{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}.quick button{padding:7px 10px;min-width:42px}.io-note{font-size:12px;color:#6b7280;margin:0 0 12px}.tabs button.active{background:#111827;color:white}.tabs button{background:#e5e7eb;color:#111827}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class='wrap'><header><div><h1>⚡ Rydbecks EL Lager</h1><small>Lageröversikt</small></div><button id='addBtn'>＋ Artikel</button></header><div class='grid'><div class='card metric'><span>Artiklar</span><b id='articleCount'>0</b></div><div class='card metric'><span>Lagervärde</span><b id='stockValue'>0 kr</b></div><div class='card metric'><span>Lågt saldo</span><b class='warn' id='lowCount'>0</b></div></div><div class='toolbar'><input id='search' placeholder='🔎 Sök material, art.nr, plats...'><select id='categoryFilter'><option value=''>Alla kategorier</option></select></div><div class='tabs'><button class='active' data-tab='stock'>Lager</button><button data-tab='history'>Historik</button></div><div class='utility'><button id='exportBtn' class='secondary'>⬇️ Backup</button><button id='importBtn' class='secondary'>⬆️ Återställ</button><input id='importFile' type='file' accept='application/json,.json' hidden></div><p class='io-note'>Backup sparar artiklar och historik som en fil som kan återställas senare.</p><section id='stock'></section><section id='history' hidden></section></div>
<dialog id='editDialog'><form method='dialog' class='modal' id='itemForm'><h2 id='formTitle'>Ny artikel</h2><input type='hidden' id='itemId'><div class='form'><label><span>Benämning *</span><input id='name' required></label><label><span>Artikelnummer</span><input id='sku'></label><label><span>Streckkod / EAN</span><div style='display:flex;gap:6px'><input id='barcode' inputmode='numeric'><button type='button' id='scanBtn' style='white-space:nowrap'>📷 Skanna</button></div></label><label><span>Kategori</span><input id='category' list='cats'><datalist id='cats'><option>Kabel</option><option>Rör</option><option>Dosor</option><option>Centralmaterial</option><option>Brytare/uttag</option><option>Belysning</option><option>Fästmateriel</option><option>Övrigt</option></datalist></label><label><span>Lagerplats</span><input id='location'></label><label><span>Antal</span><input id='qty' type='number' step='0.01' value='0'></label><label><span>Enhet</span><select id='unit'><option>st</option><option>m</option><option>m²</option><option>kg</option><option>förp</option><option>rulle</option></select></label><label><span>Inköpspris exkl. moms</span><input id='price' type='number' step='0.01' value='0'></label><label><span>Minsta lagersaldo</span><input id='min' type='number' step='0.01' value='0'></label><label class='full'><span>Leverantör</span><input id='supplier'></label></div><div class='modal-actions'><button type='button' class='secondary' id='cancel'>Avbryt</button><button value='default'>Spara</button></div></form></dialog>
<dialog id='adjustDialog'><form method='dialog' class='modal' id='adjustForm'><h2 id='adjustTitle'>Ändra saldo</h2><div class='form'><label><span>Förändring</span><input id='delta' type='number' step='0.01' required placeholder='Ex. 10 eller -5'></label><label><span>Kommentar</span><input id='note' placeholder='Ex. inköp / jobb'></label></div><div class='modal-actions'><button type='button' class='secondary' id='adjustCancel'>Avbryt</button><button>Spara</button></div></form></dialog><dialog id='scanDialog'><div class='modal'><h2>Skanna streckkod</h2><p class='muted'>Rikta kameran mot streckkoden på materialet.</p><div id='reader' style='width:100%;overflow:hidden;border-radius:14px'></div><div class='modal-actions'><button type='button' class='secondary' id='scanCancel'>Avbryt</button></div></div></dialog><script src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'></script>
<script>
const KEY='rydbecks-lager-v1', HKEY='rydbecks-lager-history-v1'; let items=JSON.parse(localStorage.getItem(KEY)||'[]'), history=JSON.parse(localStorage.getItem(HKEY)||'[]'), adjustId=null;
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(n||0); function save(){localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(HKEY,JSON.stringify(history));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let q=$('search').value.toLowerCase(), cf=$('categoryFilter').value; $('articleCount').textContent=items.length;$('stockValue').textContent=money(items.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0));$('lowCount').textContent=items.filter(x=>(+x.qty||0)<=(+x.min||0)&&(+x.min||0)>0).length;let cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();let old=cf;$('categoryFilter').innerHTML='<option value="">Alla kategorier</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('categoryFilter').value=old;let filtered=items.filter(x=>(!cf||x.category===cf)&&[x.name,x.sku,x.barcode,x.location,x.category,x.supplier].join(' ').toLowerCase().includes(q));$('stock').innerHTML=filtered.length?filtered.sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(x=>`<div class="card item ${(+x.min>0&&+x.qty<=+x.min)?'low':''}"><div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.sku||'Inget art.nr')} · ${esc(x.category||'Ingen kategori')}${x.barcode?' · EAN '+esc(x.barcode):''}</div><div class="muted">📍 ${esc(x.location||'Ingen plats')} ${x.supplier?' · '+esc(x.supplier):''}</div><div class="muted">${money((+x.qty||0)*(+x.price||0))} i lager</div></div><div><div class="qty">${x.qty} ${esc(x.unit)}</div><div class="quick"><button class="secondary" onclick="quickAdjust('${x.id}',-1)">−1</button><button onclick="quickAdjust('${x.id}',1)">+1</button></div><div class="actions"><button onclick="adjust('${x.id}')">± annat</button><button class="secondary" onclick="edit('${x.id}')">✎</button><button class="danger" onclick="removeItem('${x.id}')">×</button></div></div></div>`).join(''):'<div class="empty">Inga artiklar hittades.</div>';$('history').innerHTML=history.length?history.slice().reverse().map(h=>`<div class="history"><b>${esc(h.name)}</b>: ${h.delta>0?'+':''}${h.delta} ${esc(h.unit)}<br><span class="muted">${new Date(h.date).toLocaleString('sv-SE')} ${h.note?'· '+esc(h.note):''}</span></div>`).join(''):'<div class="empty">Ingen historik ännu.</div>'}
function openNew(){ $('formTitle').textContent='Ny artikel'; $('itemForm').reset(); $('itemId').value=''; $('qty').value=0;$('price').value=0;$('min').value=0;$('editDialog').showModal() } window.edit=id=>{let x=items.find(i=>i.id===id);$('formTitle').textContent='Redigera artikel';for(let k of ['name','sku','barcode','category','location','qty','unit','price','min','supplier'])$(k).value=x[k]??'';$('itemId').value=id;$('editDialog').showModal()};window.quickAdjust=id=>{let x=items.find(i=>i.id===id);let d=arguments.length>1?arguments[1]:0};window.quickAdjust=(id,d)=>{let x=items.find(i=>i.id===id);if(!x)return;x.qty=+(+x.qty+d).toFixed(2);history.push({date:new Date().toISOString(),name:x.name,delta:d,unit:x.unit,note:d>0?'Snabb inleverans':'Snabbt uttag'});save()};window.adjust=id=>{adjustId=id;let x=items.find(i=>i.id===id);$('adjustTitle').textContent='Ändra saldo – '+x.name;$('adjustForm').reset();$('adjustDialog').showModal()};window.removeItem=id=>{if(confirm('Ta bort artikeln?')){items=items.filter(x=>x.id!==id);save()}};
$('itemForm').addEventListener('submit',e=>{e.preventDefault();let id=$('itemId').value||crypto.randomUUID();let obj={id};for(let k of ['name','sku','barcode','category','location','unit','supplier'])obj[k]=$(k).value.trim();for(let k of ['qty','price','min'])obj[k]=+$(k).value||0;let ix=items.findIndex(x=>x.id===id);if(ix>=0)items[ix]=obj;else {items.push(obj);history.push({date:new Date().toISOString(),name:obj.name,delta:obj.qty,unit:obj.unit,note:'Startsaldo'})} $('editDialog').close();save()});$('adjustForm').addEventListener('submit',e=>{e.preventDefault();let x=items.find(i=>i.id===adjustId),d=+$('delta').value||0;x.qty=+(+x.qty+d).toFixed(2);history.push({date:new Date().toISOString(),name:x.name,delta:d,unit:x.unit,note:$('note').value.trim()});$('adjustDialog').close();save()});let scanner=null; async function stopScanner(){if(scanner){try{await scanner.stop()}catch(e){} try{scanner.clear()}catch(e){} scanner=null}} async function startScanner(){if(typeof Html5Qrcode==='undefined'){alert('Skannern kunde inte laddas. Kontrollera internetanslutningen.');return} $('scanDialog').showModal();scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140},aspectRatio:1.7},async code=>{ $('barcode').value=code; await stopScanner(); $('scanDialog').close(); })}catch(e){await stopScanner();$('scanDialog').close();alert('Kameran kunde inte startas. Tillåt kameraåtkomst och försök igen.')}} function exportBackup(){const data={app:'Rydbecks EL Lager',version:'1.2',exportedAt:new Date().toISOString(),items,history};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rydbecks-el-lager-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(file){try{const data=JSON.parse(await file.text());if(!Array.isArray(data.items)||!Array.isArray(data.history))throw new Error('Fel format');if(!confirm('Återställa backup? Nuvarande lager och historik ersätts.'))return;items=data.items;history=data.history;save();alert('Backup återställd.')}catch(e){alert('Kunde inte läsa backupfilen.')}}
$('exportBtn').onclick=exportBackup;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{const f=e.target.files[0];if(f)importBackup(f);e.target.value=''};
$('scanBtn').onclick=startScanner;$('scanCancel').onclick=async()=>{await stopScanner();$('scanDialog').close()};$('addBtn').onclick=openNew;$('cancel').onclick=()=>$('editDialog').close();$('adjustCancel').onclick=()=>$('adjustDialog').close();$('search').oninput=render;$('categoryFilter').onchange=render;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('stock').hidden=b.dataset.tab!=='stock';$('history').hidden=b.dataset.tab!=='history'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
