<!doctype html><html lang='sv'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><title>Rydbecks Lager</title><link rel='manifest' href='manifest.json'><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:18px 14px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}h1{font-size:27px;margin:0}small,.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:white;border-radius:16px;padding:15px;box-shadow:0 1px 4px #0001}.metric b{font-size:24px;display:block}.warn{color:#b45309}.toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}input,select,button{font:inherit;border-radius:12px;border:1px solid #d1d5db;padding:12px}input,select{background:white;min-width:0}#search{flex:1}button{background:#111827;color:white;border:0;font-weight:650}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px}.item h3{margin:0 0 5px;font-size:17px}.qty{font-size:22px;font-weight:750;text-align:right}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}.actions button{padding:7px 11px}.low{border:2px solid #f59e0b}dialog{border:0;border-radius:18px;width:min(94vw,560px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0008}.modal{padding:18px}.modal h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#6b7280}.form label span{display:block;margin-bottom:4px}.form input,.form select{width:100%}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;padding:40px 10px;color:#6b7280}.history{font-size:14px;border-bottom:1px solid #eee;padding:10px 0}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.active{background:#111827;color:white}.tabs button{background:#e5e7eb;color:#111827}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.grid .card:last-child{grid-column:1/-1}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class='wrap'><header><div><h1>📦 Rydbecks Lager</h1><small>Lageröversikt</small></div><button id='addBtn'>＋ Artikel</button></header><div class='grid'><div class='card metric'><span>Artiklar</span><b id='articleCount'>0</b></div><div class='card metric'><span>Lagervärde</span><b id='stockValue'>0 kr</b></div><div class='card metric'><span>Lågt saldo</span><b class='warn' id='lowCount'>0</b></div></div><div class='toolbar'><input id='search' placeholder='🔎 Sök material, art.nr, plats...'><select id='categoryFilter'><option value=''>Alla kategorier</option></select></div><div class='tabs'><button class='active' data-tab='stock'>Lager</button><button data-tab='history'>Historik</button></div><section id='stock'></section><section id='history' hidden></section></div>
<dialog id='editDialog'><form method='dialog' class='modal' id='itemForm'><h2 id='formTitle'>Ny artikel</h2><input type='hidden' id='itemId'><div class='form'><label><span>Benämning *</span><input id='name' required></label><label><span>Artikelnummer</span><input id='sku'></label><label><span>Kategori</span><input id='category' list='cats'><datalist id='cats'><option>Kabel</option><option>Rör</option><option>Dosor</option><option>Centralmaterial</option><option>Brytare/uttag</option><option>Belysning</option><option>Fästmateriel</option><option>Övrigt</option></datalist></label><label><span>Lagerplats</span><input id='location'></label><label><span>Antal</span><input id='qty' type='number' step='0.01' value='0'></label><label><span>Enhet</span><select id='unit'><option>st</option><option>m</option><option>m²</option><option>kg</option><option>förp</option><option>rulle</option></select></label><label><span>Inköpspris exkl. moms</span><input id='price' type='number' step='0.01' value='0'></label><label><span>Minsta lagersaldo</span><input id='min' type='number' step='0.01' value='0'></label><label class='full'><span>Leverantör</span><input id='supplier'></label></div><div class='modal-actions'><button type='button' class='secondary' id='cancel'>Avbryt</button><button value='default'>Spara</button></div></form></dialog>
<dialog id='adjustDialog'><form method='dialog' class='modal' id='adjustForm'><h2 id='adjustTitle'>Ändra saldo</h2><div class='form'><label><span>Förändring</span><input id='delta' type='number' step='0.01' required placeholder='Ex. 10 eller -5'></label><label><span>Kommentar</span><input id='note' placeholder='Ex. inköp / jobb'></label></div><div class='modal-actions'><button type='button' class='secondary' id='adjustCancel'>Avbryt</button><button>Spara</button></div></form></dialog>
<script>
const KEY='rydbecks-lager-v1', HKEY='rydbecks-lager-history-v1'; let items=JSON.parse(localStorage.getItem(KEY)||'[]'), history=JSON.parse(localStorage.getItem(HKEY)||'[]'), adjustId=null;
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(n||0); function save(){localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(HKEY,JSON.stringify(history));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let q=$('search').value.toLowerCase(), cf=$('categoryFilter').value; $('articleCount').textContent=items.length;$('stockValue').textContent=money(items.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0));$('lowCount').textContent=items.filter(x=>(+x.qty||0)<=(+x.min||0)&&(+x.min||0)>0).length;let cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();let old=cf;$('categoryFilter').innerHTML='<option value="">Alla kategorier</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('categoryFilter').value=old;let filtered=items.filter(x=>(!cf||x.category===cf)&&[x.name,x.sku,x.location,x.category,x.supplier].join(' ').toLowerCase().includes(q));$('stock').innerHTML=filtered.length?filtered.sort((a,b)=>a.name.localeCompare(b.name,'sv')).map(x=>`<div class="card item ${(+x.min>0&&+x.qty<=+x.min)?'low':''}"><div><h3>${esc(x.name)}</h3><div class="muted">${esc(x.sku||'Inget art.nr')} · ${esc(x.category||'Ingen kategori')}</div><div class="muted">📍 ${esc(x.location||'Ingen plats')} ${x.supplier?' · '+esc(x.supplier):''}</div><div class="muted">${money((+x.qty||0)*(+x.price||0))} i lager</div></div><div><div class="qty">${x.qty} ${esc(x.unit)}</div><div class="actions"><button onclick="adjust('${x.id}')">±</button><button class="secondary" onclick="edit('${x.id}')">✎</button><button class="danger" onclick="removeItem('${x.id}')">×</button></div></div></div>`).join(''):'<div class="empty">Inga artiklar hittades.</div>';$('history').innerHTML=history.length?history.slice().reverse().map(h=>`<div class="history"><b>${esc(h.name)}</b>: ${h.delta>0?'+':''}${h.delta} ${esc(h.unit)}<br><span class="muted">${new Date(h.date).toLocaleString('sv-SE')} ${h.note?'· '+esc(h.note):''}</span></div>`).join(''):'<div class="empty">Ingen historik ännu.</div>'}
function openNew(){ $('formTitle').textContent='Ny artikel'; $('itemForm').reset(); $('itemId').value=''; $('qty').value=0;$('price').value=0;$('min').value=0;$('editDialog').showModal() } window.edit=id=>{let x=items.find(i=>i.id===id);$('formTitle').textContent='Redigera artikel';for(let k of ['name','sku','category','location','qty','unit','price','min','supplier'])$(k).value=x[k]??'';$('itemId').value=id;$('editDialog').showModal()};window.adjust=id=>{adjustId=id;let x=items.find(i=>i.id===id);$('adjustTitle').textContent='Ändra saldo – '+x.name;$('adjustForm').reset();$('adjustDialog').showModal()};window.removeItem=id=>{if(confirm('Ta bort artikeln?')){items=items.filter(x=>x.id!==id);save()}};
$('itemForm').addEventListener('submit',e=>{e.preventDefault();let id=$('itemId').value||crypto.randomUUID();let obj={id};for(let k of ['name','sku','category','location','unit','supplier'])obj[k]=$(k).value.trim();for(let k of ['qty','price','min'])obj[k]=+$(k).value||0;let ix=items.findIndex(x=>x.id===id);if(ix>=0)items[ix]=obj;else {items.push(obj);history.push({date:new Date().toISOString(),name:obj.name,delta:obj.qty,unit:obj.unit,note:'Startsaldo'})} $('editDialog').close();save()});$('adjustForm').addEventListener('submit',e=>{e.preventDefault();let x=items.find(i=>i.id===adjustId),d=+$('delta').value||0;x.qty=+(+x.qty+d).toFixed(2);history.push({date:new Date().toISOString(),name:x.name,delta:d,unit:x.unit,note:$('note').value.trim()});$('adjustDialog').close();save()});$('addBtn').onclick=openNew;$('cancel').onclick=()=>$('editDialog').close();$('adjustCancel').onclick=()=>$('adjustDialog').close();$('search').oninput=render;$('categoryFilter').onchange=render;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('stock').hidden=b.dataset.tab!=='stock';$('history').hidden=b.dataset.tab!=='history'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
